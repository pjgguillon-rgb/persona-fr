<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Opération 37</title>
<meta name="theme-color" content="#15132b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Stencil+Display:wght@700;900&display=swap">
<style>
/* Dossier de mission sur fond de nuit : en-tete au pochoir, cartes de mission empilees, tampons de validation. Un seul theme sombre, pense pour jouer en soiree. */
:root{
  --night:#15132b;--panel:#1f1c3d;--panel-2:#2a2652;--line:#3a3568;
  --ink:#f2efe6;--muted:#aaa5cc;--gold:#f3c34f;--gold-ink:#231b05;
  --disc:#b9a2ff;--photo:#ff9f6e;--quiz:#62d6c8;--ok:#73e094;--burn:#ff6f6f;
  --display:"Big Shoulders Stencil Display","Impact","Arial Narrow",sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius:14px;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
img{max-width:100%}

.mast{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.mast h1{font-family:var(--display);font-weight:900;font-size:clamp(52px,16vw,84px);line-height:.86;letter-spacing:.01em;text-transform:uppercase;color:var(--gold)}
.mast h1 span{color:var(--ink)}
.mast .sub{color:var(--muted);font-size:15px}
.prize{display:flex;gap:12px;align-items:center;border:1px dashed var(--gold);border-radius:var(--radius);padding:12px 14px}
.prize b{color:var(--gold)}
.prize svg{flex:none;width:44px;height:34px}

.btn{border:0;border-radius:999px;padding:12px 18px;font-weight:700;background:var(--panel-2);color:var(--ink)}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.ok{background:var(--ok);color:#0d2a16}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;border:1px solid var(--burn);color:var(--burn)}
.btn.small{padding:8px 14px;font-size:14px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:14px;text-align:left}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.c-disc{color:var(--disc)}.c-photo{color:var(--photo)}.c-quiz{color:var(--quiz)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{width:100%;background:var(--night);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
textarea.field{min-height:72px;resize:vertical}

.pick h2{font-family:var(--display);font-size:34px;text-transform:uppercase;letter-spacing:.02em}
.pick p{color:var(--muted)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.names button{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 12px;text-align:left;font-weight:700;min-width:0;overflow-wrap:anywhere}
.names button small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
.box h3{font-size:17px}
.box .sub{color:var(--muted);font-size:14px}

.agent{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:14px}
.agent .who{min-width:0}
.agent .who strong{display:block;font-family:var(--display);font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.agent .count{text-align:right;flex:none}
.agent .count b{font-family:var(--display);font-size:40px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.agent .count small{display:block;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:6px;background:var(--panel);padding:4px;border-radius:999px}
.tabs button{flex:1;min-width:0;border:0;background:transparent;border-radius:999px;padding:10px 4px;font-weight:700;font-size:15px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--panel-2);color:var(--ink)}

.alert{border:2px solid var(--gold);background:var(--panel-2);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.alert .eyebrow{color:var(--gold)}
.alert p{font-size:17px}
.alert p strong{color:var(--gold)}
.alert .quote{font-size:15px;color:var(--muted);font-style:italic}

.phase{display:flex;flex-direction:column;gap:10px}
.phase-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.phase-h h2{font-family:var(--display);font-size:28px;text-transform:uppercase;letter-spacing:.02em}
.phase-h span{color:var(--muted);font-size:14px}
.mission{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.mission .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mission .code{font-family:var(--display);font-size:20px;color:var(--muted);letter-spacing:.04em}
.mission .pts{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.mission .txt{font-size:18px;line-height:1.4}
.mission .txt strong{color:var(--gold)}
.mission .how{font-size:13px;color:var(--muted)}
.mission .status{font-size:14px;color:var(--muted)}
.mission .status b{color:var(--ink)}
.mission.done{border-color:var(--ok)}
.mission.burned{border-color:var(--burn)}
.mission.done .txt,.mission.burned .txt{opacity:.7}
.mission.has-stamp{padding-bottom:50px}
.stamp{position:absolute;right:12px;bottom:10px;font-family:var(--display);font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:.06em;border:3px solid currentColor;border-radius:8px;padding:0 10px;transform:rotate(-7deg);opacity:.9;pointer-events:none}
.stamp.ok{color:var(--ok)}.stamp.burn{color:var(--burn)}.stamp.wait{color:var(--gold)}
.sealed{background:repeating-linear-gradient(135deg,var(--panel) 0 14px,var(--panel-2) 14px 28px);border:1px dashed var(--line);border-radius:var(--radius);padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.sealed b{font-family:var(--display);font-size:26px;text-transform:uppercase;letter-spacing:.03em}
.sealed span{color:var(--muted)}
.filebtn{position:relative;overflow:hidden;display:inline-flex}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}

.note{background:var(--panel);border-radius:var(--radius);padding:14px 16px;color:var(--muted);font-size:15px}
.note b{color:var(--ink)}
.banner{border-radius:var(--radius);padding:14px 16px;font-weight:700;background:var(--panel-2);border:1px solid var(--line)}
.banner.warn{border-color:var(--burn);color:var(--burn)}
.banner.info{border-color:var(--quiz)}

.rules{display:flex;flex-direction:column;gap:12px}
.rule{background:var(--panel);border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.rule h3{font-size:17px}
.rule p{color:var(--muted);font-size:15px}
.scale{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scale div{background:var(--panel);border-radius:12px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.scale b{font-family:var(--display);font-size:34px;line-height:1}
.scale small{color:var(--muted)}

.acclist{display:flex;flex-direction:column;gap:8px}
.acclist div{background:var(--panel);border-radius:12px;padding:10px 14px;font-size:15px;display:flex;justify-content:space-between;gap:10px}
.acclist div span:first-child{min-width:0;overflow-wrap:anywhere}
.acclist .r{font-weight:700;flex:none}
.acclist .r.good{color:var(--ok)}.acclist .r.bad{color:var(--burn)}.acclist .r.wait{color:var(--gold)}

.reveal{border:2px solid var(--gold);border-radius:var(--radius);padding:22px 18px;display:flex;flex-direction:column;gap:8px;text-align:center;background:radial-gradient(120% 90% at 50% 0%,var(--panel-2),var(--panel))}
.reveal .eyebrow{color:var(--gold)}
.reveal .winner{font-family:var(--display);font-weight:900;font-size:clamp(48px,15vw,76px);line-height:.9;text-transform:uppercase;color:var(--gold);overflow-wrap:anywhere}
.reveal p{color:var(--muted)}
.board{display:flex;flex-direction:column;gap:6px}
.board .r{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--panel);border-radius:12px;padding:10px 12px}
.board .rk{font-family:var(--display);font-size:22px;color:var(--muted);text-align:center}
.board .nm{min-width:0;overflow-wrap:anywhere;font-weight:700}
.board .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.board .bar{height:4px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
.board .bar i{display:block;height:100%;background:var(--gold)}
.board .pt{font-variant-numeric:tabular-nums;font-weight:700}
.board .r.first{border:1px solid var(--gold)}
.board .r.first .rk{color:var(--gold)}

.mjbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.mjbar .tag{color:var(--gold)}
.line{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.line > div{min-width:0}
.line small{display:block;color:var(--muted);font-size:13px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
.check input{width:20px;height:20px;accent-color:var(--gold)}
.presence{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.presence button{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--night);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;min-width:0}
.presence button span{min-width:0;overflow-wrap:anywhere}
.presence button i{font-style:normal;font-size:12px;font-weight:700;color:var(--ok);flex:none}
.presence button.abs{border-color:var(--burn)}
.presence button.abs i{color:var(--burn)}
.qa{display:flex;flex-direction:column;gap:8px}
.qa .item{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.qa .item p{font-size:15px}
.qa .item p.ans{font-size:17px;color:var(--ink)}
.qa .item small{color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"].y{background:var(--ok);border-color:var(--ok);color:#0d2a16}
.seg button[aria-pressed="true"].n{background:var(--burn);border-color:var(--burn);color:#2b0909}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gallery figure{margin:0;background:var(--night);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.gallery img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--panel-2)}
.gallery figcaption{padding:8px 10px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.gallery figcaption b{color:var(--ink)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);font-size:18px;font-weight:700;line-height:1}
.stepper output{min-width:36px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--night);font-weight:700;padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px);text-align:center}
.foot{color:var(--muted);font-size:13px;text-align:center}
.loading{color:var(--muted);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:no-preference){
  .intro .stamp{animation:stamp .35s ease-out both}
  @keyframes stamp{from{transform:rotate(-7deg) scale(1.6);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:.9}}
}
</style>
</head>

/* Points */
function scores(){
  var out={};
  P.forEach(function(p){out[p.id]={pts:0,done:0,mpts:0,acc:0,bonus:0,pending:0,jk:0,vol:0};});
  P.forEach(function(p){
    var dbl=jk(p.id,"double");
    p.missions.forEach(function(m,i){
      var s=mst(p.id,i),o=out[p.id],f=(dbl&&dbl.idx===i)?2:1;
      if(m.cat==="disc"&&s.st==="ok"){o.mpts+=PTS.disc*f;o.done++;}
      if(m.cat==="disc"&&s.st==="claim")o.pending++;
      if(m.cat==="photo"&&s.st==="photo"){o.done++;if(s.v!=="ko")o.mpts+=PTS.photo*f;}
      if(m.cat==="quiz"&&s.st==="ans"){o.done++;if(s.v==="ok")o.mpts+=PTS.quiz*f;}
    });
    Object.keys(JK).forEach(function(t){if(jk(p.id,t))out[p.id].jk-=JK[t].cost;});
  });
  P.forEach(function(p){var v=jk(p.id,"vol");if(v&&out[v.to])out[v.to].vol-=3;});
  var fr=flashRanks();P.forEach(function(p){out[p.id].flash=fr[p.id]||0;});
  Object.keys(S.acc||{}).forEach(function(k){var a=S.acc[k];if(!a||!out[a.from])return;if(a.st==="right")out[a.from].acc+=1;if(a.st==="wrong")out[a.from].acc-=1;});
  P.forEach(function(p){var o=out[p.id];o.bonus=+(S.bonus&&S.bonus[p.id])||0;o.pts=o.mpts+o.acc+o.bonus+o.jk+o.vol+o.flash;});
  return out;
}
function ranking(){
  var sc=scores();

  var rank=0,prev=null;list.forEach(function(x,i){if(x.s.pts!==prev){rank=i+1;prev=x.s.pts;}x.rank=rank;});
  return list;
}

function useJoker(type,val){
  var me=ui.me,u={},msg="";
  if(!isOpen()){toast("Le jeu est clos");return;}
  if(jk(me,type)){toast("Joker déjà utilisé");return;}
  if(type==="espion"){
    var hunters=[],o2=phase2Open();P.forEach(function(q){if(q.id===me)return;q.missions.forEach(function(m,i){var s=mst(q.id,i).st;if(m.ph===2&&!o2)return;if(m.cat==="disc"&&tgt(q.id,i)===me&&s!=="ok"&&s!=="burn"&&hunters.indexOf(q.id)<0)hunters.push(q.id);});});
    if(!hunters.length){toast("Personne ne te vise en ce moment. Garde ton joker pour plus tard.");return;}
    var who=hunters[Math.floor(Math.random()*hunters.length)];
    u["jk/"+me+"/espion"]={who:who,at:now()};msg="Espion : "+nameOf(who)+" te vise !";
  }else if(type==="vol"){
    if(!val||!BY[val]||val===me){toast("Choisis la personne à voler");return;}
    u["jk/"+me+"/vol"]={to:val,at:now()};msg="3 points volés à "+nameOf(val)+" 😈";
  }else{
    if(val===""||val==null){toast("Choisis une mission");return;}
    var i=+val;if(eligibleFor(type).indexOf(i)<0){toast("Cette mission n'est plus disponible pour ce joker");return;}
    if(type==="echange"){
      var m=P_m(me,i),pool=m.cat==="quiz"?GAME.quizPool:GAME.pools[m.ph][m.cat],mine={};
      BY[me].missions.forEach(function(_,j){mine[P_m(me,j).t]=1;});
      var usage={};P.forEach(function(q){q.missions.forEach(function(_,j){var mm=P_m(q.id,j);(usage[mm.t]=usage[mm.t]||[]).push({p:q.id,c:tgt(q.id,j)});});});
      var cur=tgt(me,i);
      var c=pool.filter(function(t){var u=usage[t]||[];if(mine[t]||u.length>=2)return false;if(t.indexOf("{c}")<0||!cur)return true;return !u.some(function(o){return o.c===cur||(o.p===cur&&o.c===me);});});
      if(!c.length){toast("Plus aucune mission de ce type disponible pour un échange. Ton joker est conservé.");return;}
      var nt=c[Math.floor(Math.random()*c.length)],nc=null;
      if(nt.indexOf("{c}")>=0){
        nc=tgt(me,i);
        if(!nc||(S.absent&&S.absent[nc])){
          var used={};BY[me].missions.forEach(function(_,j){var t=tgt(me,j);if(t)used[t]=1;});
          var cand=P.filter(function(q){return q.id!==me&&!used[q.id]&&!(S.absent&&S.absent[q.id]);});
          nc=cand.length?cand[Math.floor(Math.random()*cand.length)].id:null;
        }
      }
      u["sw/"+me+"/"+key(i)]={t:nt,c:nc};u["re/"+me+"/"+key(i)]=null;u["m/"+me+"/"+key(i)]=null;
      u["jk/"+me+"/echange"]={idx:i,at:now()};msg="Nouvelle mission "+code(m,i)+" !";
    }else{u["jk/"+me+"/"+type]={idx:i,at:now()};msg=type==="double"?"Mission "+code(P_m(me,i),i)+" en points doubles":"Bouclier posé sur "+code(P_m(me,i),i);}
  }
  write(u,msg);
}
function compress(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var max=1400,w=img.naturalWidth,h=img.naturalHeight,s=Math.min(1,max/Math.max(w,h));
      w=Math.round(w*s);h=Math.round(h*s);
      var c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",0.75));
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("image"));};
    img.src=url;
  });
}

/* MJ */
function markAbsent(A){
  var u={};u["absent/"+A]=true;
  var load={};P.forEach(function(p){load[p.id]=0;});
  P.forEach(function(p){p.missions.forEach(function(m,i){var t=tgt(p.id,i);if(P_m(p.id,i).c&&t&&load[t]!=null&&!DONE_ST[mst(p.id,i).st])load[t]++;});});
  var newRe={};
  P.forEach(function(p){
    if(p.id===A)return;
    p.missions.forEach(function(m,i){
      if(!P_m(p.id,i).c)return;var s=mst(p.id,i).st;
      if(tgt(p.id,i)!==A||DONE_ST[s]||s==="claim")return;
      var used={};p.missions.forEach(function(mm,j){var t=(newRe[p.id+"|"+j])||tgt(p.id,j);if(P_m(p.id,j).c&&t)used[t]=1;});
      var c=P.filter(function(q){return q.id!==p.id&&q.id!==A&&!(S.absent&&S.absent[q.id])&&!used[q.id];});
      if(!c.length)c=P.filter(function(q){return q.id!==p.id&&q.id!==A&&!(S.absent&&S.absent[q.id]);});
      c.sort(function(a,b){return load[a.id]-load[b.id]||Math.random()-.5;});
      var n=c[0];if(!n)return;
      load[n.id]++;newRe[p.id+"|"+i]=n.id;
      u["re/"+p.id+"/"+key(i)]=n.id;
      if(s==="denied")u["m/"+p.id+"/"+key(i)]=null;
    });
  });
  Object.keys(S.req||{}).forEach(function(k){var r=S.req[k];if(r&&r.st==="pending"&&r.target===A){u["req/"+k+"/st"]="ok";}});
  return write(u,nameOf(A)+" absent(e) : ses missions sont réattribuées");
}

  if(!PARTS.every(function(p){return loaded[p];})){return;}
  if(ui.me&&ls("op37_auth_"+ui.me)!==BY[ui.me].ph){ui.confirm=ui.me;ui.me=null;}
  app.innerHTML=ui.mj?renderMJ():renderPlayer();
  var pend=ui.mj?0:pendingForMe();document.title=(pend?"("+pend+") ":"")+"Opération 37";
  if(pend>lastPend&&navigator.vibrate){try{navigator.vibrate([150,80,150]);}catch(e){}}lastPend=pend;
  window.scrollTo(0,y);
}

  h+='<p class="sub">« SMS » ouvre un message déjà rédigé : choisis le contact et envoie. « Partager » permet de passer par WhatsApp.</p>';
  h+=P.slice().sort(function(a,b){return a.full.localeCompare(b.full,"fr");}).map(function(p){
    return '<div class="line"><div><b>'+esc(p.full)+'</b><small>Code : <b style="color:var(--gold);font-size:15px;letter-spacing:.08em">'+esc(ui.codes[p.id])+'</b></small></div><div class="row"><a class="btn small" href="sms:?&body='+encodeURIComponent(codeMsg(p.id))+'">SMS</a><button class="btn ghost small" data-a="share-code" data-id="'+p.id+'">Partager</button></div></div>';
  }).join("");
  return h+'</section>';
}
function mjSoiree(){
  var h=mjCodes(),reqs=Object.keys(S.req||{}).map(function(k){return {k:k,r:S.req[k]};}).filter(function(x){return x.r&&x.r.st==="pending";});
  h+='<section class="box"><h3>Demandes d\'absence'+(reqs.length?' ('+reqs.length+')':'')+'</h3>';
  if(!reqs.length)h+='<p class="sub">Aucune demande. Tu peux profiter de ta soirée.</p>';
  reqs.forEach(function(x){
    var r=x.r;
    h+='<div class="alert"><p><strong>'+esc(nameOf(r.from))+'</strong> dit que <strong>'+esc(nameOf(r.target))+'</strong> n\'est pas là.</p><div class="row"><button class="btn ok small" data-a="req-ok" data-id="'+r.target+'">C\'est vrai, réattribuer</button><button class="btn ghost small" data-a="req-ko" data-k="'+x.k+'">Non, '+esc(nameOf(r.target))+' est là</button></div></div>';
  });
  h+='</section>';
  h+='<section class="box"><h3>Présences</h3><p class="sub">Touche un nom pour le marquer absent : les missions qui le visent passent sur quelqu\'un de présent.</p><div class="presence">'+
    P.slice().sort(function(a,b){return a.full.localeCompare(b.full,"fr");}).map(function(p){var ab=S.absent&&S.absent[p.id];return '<button class="'+(ab?'abs':'')+'" data-a="pres" data-id="'+p.id+'"><span>'+esc(p.full)+'</span><i>'+(ab?'absent':'présent')+'</i></button>';}).join("")+'</div>';
  if(ui.confirmAbs)h+='<div class="alert"><p>Marquer <strong>'+esc(nameOf(ui.confirmAbs))+'</strong> absent(e) et réattribuer ses missions ?</p><div class="row"><button class="btn ok small" data-a="abs-yes">Oui</button><button class="btn ghost small" data-a="abs-no">Annuler</button></div></div>';
  h+='</section>';
  var open2=phase2Open(),st=S.state.status;
  h+='<section class="box"><h3>Déroulé</h3>'+
    '<div class="line"><div><b>Missions du resto</b><small>'+(open2?'Ouvertes':'Ouverture auto à 20h40, '+untilText())+'</small></div>'+(open2?'':'<button class="btn small" data-a="p2">Ouvrir maintenant</button>')+'</div>'+
    '<div class="line"><div><b>Jeu</b><small>'+(st==="open"&&Date.now()>=CLOSE?'Fermé automatiquement à 2h : plus de nouvelles missions':'')+({open:Date.now()>=CLOSE?'':'En cours, fermeture automatique à 2h',closed:'Clos, résultat pas encore dévoilé',revealed:'Gagnant dévoilé à tous'})[st]+'</small></div>'+
    (st==="open"?'<button class="btn small" data-a="status" data-v="closed">Clore le jeu</button>':st==="closed"?'<button class="btn primary small" data-a="status" data-v="revealed">Révéler le gagnant</button>':'<button class="btn ghost small" data-a="status" data-v="closed">Masquer le résultat</button>')+'</div>'+
    (st!=="open"?'<label class="check"><input type="checkbox" id="showfull" data-a="showfull"'+(S.state.showFull?' checked':'')+'> Montrer aussi le classement complet à tous</label><button class="link" data-a="status" data-v="open">Rouvrir le jeu</button>':'')+
    '</section>';
  h+='<section class="box"><h3>Avant la soirée</h3><p class="sub">Après tes tests, remets tout à zéro.</p>'+(ui.confirmReset?'<div class="row"><button class="btn danger small" data-a="reset-yes">Oui, tout effacer</button><button class="btn ghost small" data-a="reset-no">Non</button></div>':'<div class="row"><button class="btn danger small" data-a="reset">Tout remettre à zéro</button></div>')+'</section>';
  return h;
}
function mjCorrection(){
  var h='<section class="box"><h3>Quiz</h3><p class="sub">Une bonne réponse rapporte 1 point.</p><div class="qa">',n=0;
  P.forEach(function(p){p.missions.forEach(function(m,i){
    if(m.cat!=="quiz")return;var s=mst(p.id,i);if(s.st!=="ans")return;n++;
    h+='<div class="item"><small>'+esc(p.full)+'</small><p>'+esc(P_m(p.id,i).t)+'</p><p class="ans">« '+esc(s.ans)+' »</p><div class="seg"><button class="y" data-a="verdict" data-id="'+p.id+'" data-i="'+i+'" data-v="ok" aria-pressed="'+(s.v==="ok")+'">Bonne</button><button class="n" data-a="verdict" data-id="'+p.id+'" data-i="'+i+'" data-v="ko" aria-pressed="'+(s.v==="ko")+'">Fausse</button></div></div>';
  });});
  if(!n)h+='<p class="sub">Aucune réponse pour l\'instant.</p>';
  h+='</div></section>';
  h+='<section class="box"><h3>Photos</h3><p class="sub">Une photo envoyée rapporte 2 points, sauf si tu la refuses.</p>';
  if(!ui.photos)h+='<div class="row"><button class="btn primary small" data-a="load-photos"'+(ui.photosLoading?' disabled':'')+'>'+(ui.photosLoading?'Chargement...':'Afficher les photos')+'</button></div>';
  else{
    var keys=Object.keys(ui.photos).sort();
    if(!keys.length)h+='<p class="sub">Aucune photo pour l\'instant.</p>';
    else{
      h+='<div class="row"><button class="btn small" data-a="zip">Tout télécharger (.zip)</button><button class="link" data-a="load-photos">Actualiser</button></div><div class="gallery">'+keys.map(function(k){
        var ph=ui.photos[k],pid=ph.by,i=ph.idx,s=mst(pid,i);if(!BY[pid])return "";
        return '<figure><a href="'+ph.data+'" download="'+pid+'-'+code(P_m(pid,i),i)+'.jpg"><img src="'+ph.data+'" alt="Photo de '+esc(BY[pid].full)+'" loading="lazy"></a><figcaption><b>'+esc(BY[pid].name)+'</b><span>'+mtext(pid,i)+'</span><div class="seg"><button class="y" data-a="pverdict" data-id="'+pid+'" data-i="'+i+'" data-v="" aria-pressed="'+(s.v!=="ko")+'">Validée</button><button class="n" data-a="pverdict" data-id="'+pid+'" data-i="'+i+'" data-v="ko" aria-pressed="'+(s.v==="ko")+'">Refusée</button></div></figcaption></figure>';
      }).join("")+'</div>';
    }
  }
  h+='</section>';
  return h;
}
function mjClassement(){
  var list=ranking(),h='';
  var top=list.filter(function(x){return x.rank===1;});
  if(top.length>1&&top[0].s.pts>0)h+='<div class="banner warn">Égalité en tête : '+top.map(function(x){return esc(x.p.name);}).join(", ")+'. Départage-les avec un point bonus avant de révéler.</div>';
  h+=boardHtml(list,true);
  h+='<section class="box"><h3>Bonus ou malus</h3><p class="sub">Pour départager ou récompenser un coup d\'éclat.</p>'+P.slice().sort(function(a,b){return a.full.localeCompare(b.full,"fr");}).map(function(p){var b=+(S.bonus&&S.bonus[p.id])||0;return '<div class="line"><span>'+esc(p.full)+'</span><div class="stepper"><button data-a="bonus" data-id="'+p.id+'" data-v="-1" aria-label="Retirer un point">−</button><output>'+(b>0?'+':'')+b+'</output><button data-a="bonus" data-id="'+p.id+'" data-v="1" aria-label="Ajouter un point">+</button></div></div>';}).join("")+'</section>';
  return h;
}
function pinHtml(){
  return '<div class="wrap">'+mast()+'<section class="box"><h3>Accès maître du jeu</h3><label class="sub" for="pin">Code</label><input class="field" id="pin" inputmode="numeric" autocomplete="off" placeholder="4 chiffres"><div class="row"><button class="btn primary" data-a="pin">Entrer</button><button class="btn ghost" data-a="pin-cancel">Retour au jeu</button></div></section></div>';
}

/* Evenements */
function sha(t){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(t)).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0");}).join("");});}
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.getAttribute("data-a"),id=b.getAttribute("data-id"),v=b.getAttribute("data-v"),i=b.hasAttribute("data-i")?+b.getAttribute("data-i"):null,k=b.getAttribute("data-k");
  if(a==="photo"||a==="showfull"||a==="quiz-input"||a==="acc-to"||a==="acc-tpl"||a==="jk-sel")return;
  switch(a){
    case "pick":ui.confirm=id;break;
    case "me-ok":ui.me=ui.confirm;ui.confirm=null;ls("op37_me",ui.me);window.scrollTo(0,0);break;
    case "me-cancel":ui.confirm=null;break;
    case "me-change":ls("op37_auth_"+ui.me,null);ui.me=null;ls("op37_me",null);break;
    case "code-check":{
      var pid=ui.confirm,val=((document.getElementById("pcode")||{}).value||"").trim();
      if(!/^\d{4}$/.test(val)){toast("Le code fait 4 chiffres");return;}
      sha("op37-pin-"+pid+"-"+val).then(function(hh){
        if(hh!==BY[pid].ph){toast("Code incorrect");return;}
        ls("op37_auth_"+pid,hh);ls("op37_me",pid);ui.me=pid;ui.confirm=null;window.scrollTo(0,0);render(true);
      });
      return;}
    case "tab":ui.tab=b.getAttribute("data-t");break;
    case "claim":claim(i);return;
    case "claim-yes":answerClaim(id,i,true);return;
    case "unclaim":unclaim(k);return;
    case "claim-flash":claimFlash();return;
    case "flash-yes":answerFlash(id,true);return;
    case "flash-no":answerFlash(id,false);return;
    case "album":ui.albumLoading=true;render(true);ref.child("photos").once("value").then(function(sn){ui.album=sn.val()||{};}).catch(function(){toast("Impossible de charger l'album");}).then(function(){ui.albumLoading=false;render(true);});return;
    case "claim-no":answerClaim(id,i,false);return;
    case "quiz":var ta=document.getElementById("quiz-"+i);sendQuiz(i,ta?ta.value:"");return;
    case "absent":requestAbsent(i);return;
    case "accuse":var s1=document.getElementById("acc-to"),s2=document.getElementById("acc-tpl");accuse(s1?s1.value:"",s2?s2.value:"");return;
    case "jk-use":var tt=b.getAttribute("data-t"),se=document.getElementById("jk-"+tt);useJoker(tt,se?se.value:null);return;
    case "pin":var pin=((document.getElementById("pin")||{}).value||"").trim();sha("op37-"+pin).then(function(hh){if(hh===PIN_HASH){ls("op37_mj","1");ls("op37_mjk",pin);ui.mj=true;ui.pinOpen=false;loadCodes();render(true);}else{toast("Code incorrect");}});return;
    case "share-code":var msg=codeMsg(id);if(navigator.share){navigator.share({text:msg}).catch(function(){});}else if(navigator.clipboard){navigator.clipboard.writeText(msg).then(function(){toast("Message copié, colle-le dans WhatsApp");},function(){toast("Copie impossible");});}return;
    case "pin-cancel":ui.pinOpen=false;history.replaceState(null,"",location.pathname);break;
    case "mj-exit":ui.mj=false;history.replaceState(null,"",location.pathname);break;
    case "mjtab":ui.mjTab=b.getAttribute("data-t");break;
    case "req-ok":markAbsent(id);return;
    case "req-ko":var u0={};u0["req/"+k+"/st"]="ko";write(u0,"Demande refusée");return;
    case "pres":if(S.absent&&S.absent[id]){var u1={};u1["absent/"+id]=null;write(u1,nameOf(id)+" de nouveau présent(e)");return;}ui.confirmAbs=id;break;
    case "abs-yes":var A=ui.confirmAbs;ui.confirmAbs=null;markAbsent(A);return;
    case "abs-no":ui.confirmAbs=null;break;
    case "p2":write({"state/phase2":true},"Missions du resto ouvertes");return;
    case "status":var u2={};u2["state/status"]=v;write(u2,v==="revealed"?"Gagnant dévoilé":v==="closed"?"Jeu clos":"Jeu rouvert");return;
    case "reset":ui.confirmReset=true;break;
    case "reset-no":ui.confirmReset=false;break;
    case "reset-yes":ui.confirmReset=false;ui.photos=null;write({m:null,acc:null,req:null,absent:null,re:null,bonus:null,photos:null,pins:null,jk:null,sw:null,state:{status:"open",phase2:false,showFull:false}},"Tout est remis à zéro");return;
    case "verdict":var u3={};u3["m/"+id+"/"+key(i)+"/v"]=mst(id,i).v===v?null:v;write(u3);return;
    case "pverdict":var u4={};u4["m/"+id+"/"+key(i)+"/v"]=v||null;write(u4);return;
    case "bonus":var u5={};u5["bonus/"+id]=((+(S.bonus&&S.bonus[id])||0)+(+v))||null;write(u5);return;
    case "load-photos":ui.photosLoading=true;render(true);ref.child("photos").once("value").then(function(s){ui.photos=s.val()||{};}).catch(function(){toast("Impossible de charger les photos");}).then(function(){ui.photosLoading=false;render(true);});return;
    case "zip":zipAll();return;
  }
  render(true);
});
app.addEventListener("change",function(e){
  var t=e.target,a=t&&t.getAttribute("data-a");
  if(a==="photo"){var f=t.files&&t.files[0];sendPhoto(+t.getAttribute("data-i"),f);}
  if(a==="showfull")write({"state/showFull":t.checked});
  if(a==="acc-to")ui.accTo=t.value;
  if(a==="acc-tpl")ui.accTpl=t.value;
});
app.addEventListener("input",function(e){
  var t=e.target,a=t&&t.getAttribute("data-a");
  if(a==="quiz-input")ui.quizDraft[+t.getAttribute("data-i")]=t.value;
});
function zipAll(){
  if(!ui.photos)return;
  var go=function(){
    var z=new JSZip();
    Object.keys(ui.photos).forEach(function(k){var ph=ui.photos[k];if(!BY[ph.by])return;z.file(BY[ph.by].full.replace(/\s+/g,"-")+"_"+code(P_m(ph.by,ph.idx),ph.idx)+".jpg",ph.data.split(",")[1],{base64:true});});
    z.generateAsync({type:"blob"}).then(function(blob){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="operation-37-photos.zip";document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);});
  };
  if(window.JSZip)return go();
  var s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js";s.onload=go;s.onerror=function(){toast("Téléchargement du zip impossible, enregistre les photos une par une.");};document.head.appendChild(s);
}

function loadCodes(){var k=ls("op37_mjk");if(!k||typeof crypto==="undefined"||!crypto.subtle)return;decryptCodes(k).then(function(c){ui.codes=c;render(true);}).catch(function(){ui.codes=null;ls("op37_mj",null);ls("op37_mjk",null);ui.mj=false;ui.pinOpen=true;app.innerHTML=pinHtml();toast("Code maître changé : entre le nouveau code");});}
/* Demarrage */
(function init(){
  var saved=ls("op37_me");if(saved&&BY[saved])ui.me=saved;
  var wantsMJ=/^#mj/.test(location.hash||"");
  if(ls("op37_mj")==="1"&&ls("op37_mjk")&&wantsMJ){ui.mj=true;loadCodes();}
  else if(wantsMJ)ui.pinOpen=true;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();ref=db.ref(ROOT);
  }catch(e){ui.err="Connexion au jeu impossible. Réessaie dans un instant.";render(true);return;}
  if(ui.pinOpen){app.innerHTML=pinHtml();}
  ref.child("code").once("value").then(function(s){
    if(!s.exists())return ref.update({code:"OP37",phase:"operation-37",players:{pierre:"maitre du jeu"},state:{status:"open",phase2:false,showFull:false}});
  }).catch(function(e){console.error(e);});
  PARTS.forEach(function(part){
    ref.child(part).on("value",function(s){
      var v=s.val();
      if(part==="state")S.state=Object.assign({status:"open",phase2:false,showFull:false},v||{});
      else S[part]=v||{};
      loaded[part]=true;
      if(!ui.pinOpen)render();
    },function(err){ui.err="Le jeu n'arrive pas à lire ses données ("+(err&&err.code||"erreur")+"). Préviens Pierre.";render(true);});
  });
  setTimeout(function(){if(!PARTS.every(function(p){return loaded[p];})&&!ui.err){ui.err="Connexion lente... vérifie ton réseau, la page se mettra à jour toute seule.";app.innerHTML='<div class="wrap">'+mast()+'<div class="banner info">'+ui.err+'</div></div>';ui.err=null;}},8000);
  app.classList.add("intro");setTimeout(function(){app.classList.remove("intro");},1500);
  var lastOpen=null;
  var lastStart=started();
  setInterval(function(){var o=phase2Open(),st=started();if(o!==lastOpen||!o||st!==lastStart||!st){lastOpen=o;lastStart=st;if(!ui.pinOpen)render();}},20000);
})();
})();
</script>
